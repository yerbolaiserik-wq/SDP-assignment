<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#111111"/>
    </marker>
    <marker id="triangle" markerWidth="15" markerHeight="15" refX="7.5" refY="7.5" orient="auto">
      <path d="M 0 0 L 15 7.5 L 0 15 z" fill="#ffffff" stroke="#111111" stroke-width="1.8"/>
    </marker>
    <marker id="diamond" markerWidth="18" markerHeight="18" refX="9" refY="9" orient="auto">
      <path d="M 9 0 L 18 9 L 9 18 L 0 9 z" fill="#ffffff" stroke="#111111" stroke-width="2"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #111111; stroke-width: 4; }
    .head { fill: #009900; stroke: #111111; stroke-width: 4; }
    .split { stroke: #111111; stroke-width: 2.5; }
    .title { font: italic bold 24px Arial, sans-serif; fill: #ffffff; }
    .body { font: bold 18px Arial, sans-serif; fill: #009900; }
    .small { font: bold 14px Arial, sans-serif; fill: #009900; }
    .note { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .noteText { font: bold 13px Arial, sans-serif; fill: #009900; }
    .line { stroke: #111111; stroke-width: 4; fill: none; }
    .thin { stroke: #111111; stroke-width: 2.5; fill: none; }
    .dash { stroke: #111111; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
    .caption { font: bold 18px Arial, sans-serif; fill: #111111; }
  </style>

  <rect x="20" y="20" width="1060" height="640" rx="4" fill="#ffffff"/>
  <text x="340" y="54" class="caption">Windows OS Notice System UML</text>

  <!-- Abstraction -->
  <rect class="box" x="90" y="95" width="260" height="150"/>
  <rect class="head" x="90" y="95" width="260" height="58"/>
  <line class="split" x1="90" y1="153" x2="350" y2="153"/>
  <line class="split" x1="90" y1="198" x2="350" y2="198"/>
  <text class="title" x="142" y="132">SystemNotice</text>
  <text class="body" x="108" y="184">- channel : OutputChannel</text>
  <text class="body" x="108" y="229">+ send()</text>

  <!-- Implementor -->
  <rect class="box" x="690" y="98" width="270" height="125"/>
  <rect class="head" x="690" y="98" width="270" height="55"/>
  <line class="split" x1="690" y1="153" x2="960" y2="153"/>
  <text class="title" x="748" y="133">OutputChannel</text>
  <text class="body" x="715" y="190">+ output()</text>

  <!-- Refined Abstractions -->
  <rect class="box" x="35" y="375" width="245" height="120"/>
  <rect class="head" x="35" y="375" width="245" height="53"/>
  <line class="split" x1="35" y1="428" x2="280" y2="428"/>
  <text class="title" x="78" y="410">UpdateNotice</text>
  <text class="body" x="56" y="470">+ prepareMessage()</text>

  <rect class="box" x="315" y="375" width="245" height="120"/>
  <rect class="head" x="315" y="375" width="245" height="53"/>
  <line class="split" x1="315" y1="428" x2="560" y2="428"/>
  <text class="title" x="350" y="410">SecurityNotice</text>
  <text class="body" x="336" y="470">+ prepareMessage()</text>

  <!-- Concrete Implementors -->
  <rect class="box" x="665" y="355" width="330" height="155"/>
  <rect class="head" x="665" y="355" width="330" height="53"/>
  <line class="split" x1="665" y1="408" x2="995" y2="408"/>
  <text class="title" x="710" y="390">Concrete Channels</text>
  <text class="body" x="690" y="445">+ ToastChannel.output()</text>
  <text class="body" x="690" y="473">+ EventLogChannel.output()</text>
  <text class="body" x="690" y="501">+ CommandPromptAdapter.output()</text>

  <!-- Legacy class for Adapter -->
  <rect class="box" x="705" y="560" width="280" height="90"/>
  <rect class="head" x="705" y="560" width="280" height="42"/>
  <line class="split" x1="705" y1="602" x2="985" y2="602"/>
  <text class="title" x="730" y="590">OldCommandPromptTool</text>
  <text class="small" x="724" y="632">+ writeLine(window, severity, text)</text>

  <!-- Composition from abstraction to implementor -->
  <line class="line" x1="350" y1="165" x2="690" y2="160" marker-start="url(#diamond)"/>

  <!-- Inheritance arrows -->
  <line class="line" x1="158" y1="375" x2="190" y2="247" marker-end="url(#triangle)"/>
  <line class="line" x1="438" y1="375" x2="250" y2="247" marker-end="url(#triangle)"/>
  <line class="line" x1="830" y1="355" x2="830" y2="225" marker-end="url(#triangle)"/>

  <!-- Adapter wraps old tool -->
  <line class="thin" x1="840" y1="510" x2="840" y2="560" marker-end="url(#arrow)"/>
  <text class="small" x="858" y="543">wraps</text>

  <!-- Note like reference image -->
  <circle cx="300" cy="224" r="8" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <line class="dash" x1="300" y1="232" x2="300" y2="305"/>
  <line class="dash" x1="300" y1="305" x2="520" y2="305"/>
  <rect class="note" x="520" y="280" width="245" height="50"/>
  <text class="noteText" x="538" y="310">this.channel.output(request);</text>
</svg>
